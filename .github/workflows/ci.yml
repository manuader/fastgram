# CI — P0-REPO-008. Obligatorio en todo PR.
#
# `boundaries` es un job aparte a propósito: cuando falla, el mensaje tiene que
# decir "cruzaste una frontera de la arquitectura", no perderse entre 200
# líneas de errores de tipos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  boundaries:
    name: fronteras de la arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: core no importa adapters, ports son puros, sin ciclos
        run: pnpm boundaries
      - name: los números del PRD no divergen entre paquetes
        run: pnpm consistency

  integration:
    name: integración (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fastgram
          POSTGRES_PASSWORD: fastgram
          POSTGRES_DB: fastgram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastgram"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        # Las imágenes de MinIO viven en quay.io: `minio/minio:latest` en
        # Docker Hub falla con "pull access denied", que parece un problema de
        # credenciales y no lo es.
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: fastgram
          MINIO_ROOT_PASSWORD: fastgram-dev-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fastgram:fastgram@localhost:5432/fastgram_test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: fastgram-test
      S3_ACCESS_KEY_ID: fastgram
      S3_SECRET_ACCESS_KEY: fastgram-dev-secret
      S3_PUBLIC_URL: http://localhost:9000/fastgram-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bucket de test
        run: |
          docker run --rm --network host quay.io/minio/mc:latest \
            alias set l http://localhost:9000 fastgram fastgram-dev-secret
          docker run --rm --network host quay.io/minio/mc:latest \
            mb --ignore-existing l/fastgram-test
      - run: pnpm test:int
      - name: suites que necesitan Postgres y MinIO de verdad
        # Sin estos servicios, las suites de contrato de `Storage` y `Queue`
        # se saltean solas indicando el motivo. Saltearse en CI es cobertura
        # que nadie corre: acá corren.
        run: pnpm --filter @fastgram/adapters test
      - name: encolar dentro de la transacción de Drizzle (ADR-005)
        # `packages/adapters` tiene su propio `test:int` y NO entra en el de la
        # raíz. Es el que prueba la garantía que justifica usar Postgres en vez
        # de Redis; saltearlo deja esa decisión sin medir.
        run: pnpm --filter @fastgram/adapters test:int

  binario:
    name: el artefacto que se despliega arranca
    runs-on: ubuntu-latest
    # Job aparte y no un paso más del de integración: lo que mide es distinto
    # —el artefacto compilado, no el código— y cuando falla, el nombre del job
    # tiene que decir qué se rompió sin abrir el log.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fastgram
          POSTGRES_PASSWORD: fastgram
          POSTGRES_DB: fastgram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastgram"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fastgram:fastgram@localhost:5432/fastgram_test
      # Desde `P1-STORAGE-007` las dos apps montan `S3Storage` y las cinco
      # variables son **obligatorias**: sin ellas el binario muere al arrancar
      # nombrándolas, que es el punto —un storage que se apaga solo en
      # producción responde `409` para siempre sin decir nada.
      #
      # **No hace falta MinIO en este job.** Construir el cliente de S3 no abre
      # ninguna conexión y firmar es CPU local; el smoke sólo hace `POST
      # /content`, que no toca el storage. Con las variables alcanza, y agregar
      # el servicio haría este job más lento por nada.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: fastgram-test
      S3_ACCESS_KEY_ID: fastgram
      S3_SECRET_ACCESS_KEY: fastgram-dev-secret
      S3_PUBLIC_URL: http://localhost:9000/fastgram-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: construir de verdad
        run: pnpm build
      - name: migrar
        run: pnpm --filter @fastgram/db db:migrate
      # Las comillas no son estilo: un `:` sin comillas en un escalar de YAML
      # parte la clave y **el workflow entero deja de parsear**. Lo escribí así
      # en la tanda anterior y lo encontró `prettier` recién ahora, al entrar
      # `format:check` en `pnpm verify`.
      - name: "los dos binarios: la API escribe y encola, el worker consume"
        # `pnpm verify` no puede ver esto: ahí todo corre con tsx o vitest, que
        # resuelven TypeScript. Dos veces ya pasó que el build quedara verde y
        # el artefacto no arrancara — la primera por `exports` a `.ts`, la
        # segunda por arrancar `boss` en vez del adaptador, con `/health` en 200
        # y el primer encolado muerto.
        #
        # Y desde P1-QUEUE-008 levanta también el worker, porque encolar sin
        # consumir no es un circuito: el nombre de la cola, la forma del payload
        # y los permisos del rol sobre el esquema de pg-boss sólo se verifican
        # con los dos procesos hablando entre sí.
        run: pnpm smoke:binary

  vision:
    name: servicio de visión (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: ffmpeg
        # Dependencia dura: sin él no hay OCR sobre video, y el test que
        # verifica la degradación a `partial` necesita que exista para
        # distinguir "ffmpeg no está" de "ffmpeg no sacó frames".
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: dependencias
        working-directory: services/vision
        run: uv venv --python 3.12 .venv && uv pip install -e ".[dev]"
      - name: tests
        working-directory: services/vision
        # Sin el extra `ocr`: el servicio tiene que pasar sus tests SIN motor.
        # Es la forma de verificar que la degradación de AI-016 funciona de
        # verdad, y no sólo que el camino feliz anda.
        run: .venv/bin/python -m pytest -q
      - name: lint
        working-directory: services/vision
        run: .venv/bin/python -m ruff check . && .venv/bin/python -m ruff format --check .

  task-id:
    name: el PR declara su tarea
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: El título arranca con un ID de tasks.md
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^P[0-5]-[A-Z]+-[0-9]{3}'; then
            echo "::error::El título del PR tiene que arrancar con el ID de la tarea."
            echo "Recibido: $TITLE"
            echo "Esperado por ejemplo: 'P1-QUOTA-003: descuento atómico de content saves'"
            exit 1
          fi
